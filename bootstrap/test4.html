<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <nav class="bg-danger p-3">
      <a href="" class="navbar-brand text-white fs-3">Zomato</a>
    </nav>
    <div class="row m-3">
      <div class="col-3">
        <div class="card">
          <div class="card-header border">
            <img 
                height="50px"
              src="../public/assets/Chicken-Tandoori.jpg"
              class="img-fluid"
              alt="Image Not Found"
            />
          </div>
          <div class="card-body border text-center">
            <h4>Chicken Tandoori</h4>
            <h5><i class="bi bi-currency-rupee"></i>299/-</h5>
            <span><i class="bi bi-dash-circle-fill fs-4 mx-2"></i></span
            ><b class="fs-4">1</b
            ><span><i class="bi bi-plus-circle-fill fs-4 mx-2"></i></span>
          </div>
        </div>
      </div>
      <div class="col-3">
        <div class="card">
          <div class="card-header border">
            <img
              src="../public/assets/Mutton-Biryani.jpg"
              class="img-fluid"
              alt="Image Not Found"
            />
          </div>
          <div class="card-body border text-center">
            <h4>Mutton Biryani</h4>
            <h5><i class="bi bi-currency-rupee"></i>499/-</h5>
            <span><i class="bi bi-dash-circle-fill fs-4 mx-2"></i></span
            ><b class="fs-4">1</b
            ><span><i class="bi bi-plus-circle-fill fs-4 mx-2"></i></span>
          </div>
        </div>
      </div>
      <div class="col-3">
        <div class="card">
          <div class="card-header border">
            <img height="50px"
              src="../public/assets/Fish-Fry.jpg"
              class="img-fluid"
              alt="Image Not Found"
            />
          </div>
          <div class="card-body border text-center">
            <h4>Fish Fry</h4>
            <h5><i class="bi bi-currency-rupee"></i>399/-</h5>
            <span><i class="bi bi-dash-circle-fill fs-4 mx-2"></i></span
            ><b class="fs-4">1</b
            ><span><i class="bi bi-plus-circle-fill fs-4 mx-2"></i></span>
          </div>
        </div>
      </div>
      <div class="col-3">
        <div class="card">
          <div class="card-header border">
            <img
              src="../public/assets/Crabs-Fry.jpg"
              class="img-fluid"
              alt="Image Not Found"
            />
          </div>
          <div class="card-body border text-center">
            <h4>Crabs Fry</h4>
            <h5><i class="bi bi-currency-rupee"></i>199/-</h5>
            <span><i class="bi bi-dash-circle-fill fs-4 mx-2"></i></span
            ><b class="fs-4">1</b
            ><span><i class="bi bi-plus-circle-fill fs-4 mx-2"></i></span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
