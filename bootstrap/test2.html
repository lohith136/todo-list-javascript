<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="./css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        .navbar-dark{
            background: linear-gradient(45deg,black,cyan);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark">
        <a href="" class="navbar-brand">Login Form</a>
        <button class="btn btn-warning me-5">Login</button>
    </nav>
    <div class="card w-50 m-auto mt-5">
        <div class="card-header text-center bg-dark navbar-dark text-white">
           <h1>Login Form</h1>
        </div>
        <div class="card-body">
            <form action="">
                <input type="text" class="form-control my-3" placeholder="Enter the Username"/>
                <div class="input-group my-3">
                    <input type="password" class="form-control" placeholder="Enter the Password" aria-describedby="basic-addon1">
                    <span class="input-group-text" id="basic-addon1"><i class="bi bi-eye"></i></span>
                </div>
                
                <div class="text-center mt-3">
                    <button class="btn btn-dark navbar-dark">Submit</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
