<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./bootstrap/css/bootstrap.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-warning">
      <div class="container-fluid">
        <a href="#" class="navbar-brand">📝ToDo</a>
      </div>
    </nav>

    <section>
      <div class="row">
        <div class="col-6 m-auto">
          <div class="card mt-3">
            <div class="card-header text-center bg-warning text-white">
              <h1>To Do List</h1>
            </div>
            <div class="card-body">
              <form id="task-form">
                <input
                  type="text"
                  placeholder="Enter the Task"
                  class="form-control mb-2"
                  id="task-ele"
                />
                <button type="submit" class="btn btn-warning text-white mb-2">Add</button>
                
              </form>
              <button type="submit" class="btn btn-warning text-white" id="save-btn">Save</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section>
      <div class="row">
        <div class="col-6 m-auto">
          <div class="card mt-3">
            <div class="card-body">
              <ol class="list-group" id="taskList-ele">
                
              </ol>
            </div>
          </div>
        </div>
      </div>
    </section>
    <script src="./todoslocal.js"></script>
  </body>
</html>
